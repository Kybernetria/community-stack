name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v5
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      # dtolnay/rust-toolchain master (toolchain selector; pinned commit)
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: nightly-2026-07-25
          components: rustfmt, clippy
      # Swatinem/rust-cache v2.9.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: scripts/check-boundaries.sh
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: python3 scripts/smoke-workspace.py --binary target/debug/community-stack
      - run: test -z "$(cargo tree -i sqlx 2>/dev/null)"
      - run: test "$(cargo tree -i libsqlite3-sys | grep -c '^libsqlite3-sys ')" -eq 1

  clients:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v5
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      # actions/setup-python v6.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.14"
      # actions/setup-node v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "24"
      - run: python -m py_compile $(find clients examples rns-bridge -name '*.py' -type f -print)
      - run: python -m unittest discover -s tests/python -v
      - run: node --check examples/fact-console/app.js
      - run: node --check examples/community-hub/app.js
      - run: python -m pip download --require-hashes --no-deps -r rns-bridge/requirements.txt -d /tmp/wheels
